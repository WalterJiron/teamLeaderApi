services:
  db:
    build: ./db
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - teamlider-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1500M

  # https://geoinnova.org/blog-territorio/postgresql-y-pgadmin-con-docker/
  paneldb:
    image: dpage/pgadmin4:9.8
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - teamlider-net

  api:
    build: ./api
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "8000:8000"
    volumes:
      - "./api:/app"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MONGO_URL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-adminpassword}@mongodb:27017/?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME:-agent_memory_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-teamleader-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-teamleader-client}
      JWT_KEY_ID: ${JWT_KEY_ID:-primary}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-15}
      JWT_REFRESH_EXPIRE_MINUTES: ${JWT_REFRESH_EXPIRE_MINUTES:-10080}
      MFA_CHALLENGE_EXPIRE_MINUTES: ${MFA_CHALLENGE_EXPIRE_MINUTES:-5}
      REDIS_URL: redis://redis:6379/0
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY must be set in .env}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?CREDENTIALS_ENCRYPTION_KEY must be set in .env}
      MFA_ISSUER_NAME: ${MFA_ISSUER_NAME:-TeamLeader}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8000}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      PASSWORD_HISTORY_SIZE: ${PASSWORD_HISTORY_SIZE:-5}
      BREACHED_PASSWORD_CHECK_ENABLED: ${BREACHED_PASSWORD_CHECK_ENABLED:-false}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      MFA_MAX_ATTEMPTS: ${MFA_MAX_ATTEMPTS:-5}
      MFA_LOCKOUT_MINUTES: ${MFA_LOCKOUT_MINUTES:-15}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-true}
      ALLOW_OPEN_REGISTRATION: ${ALLOW_OPEN_REGISTRATION:-true}
      REQUIRE_EMAIL_VERIFICATION_FOR_LOGIN: ${REQUIRE_EMAIL_VERIFICATION_FOR_LOGIN:-false}
      AUTO_CREATE_TABLES: "false"
      AUDIT_HASH_CHAIN_ENABLED: ${AUDIT_HASH_CHAIN_ENABLED:-true}
      EMAIL_OUTBOX_INTERVAL_SECONDS: ${EMAIL_OUTBOX_INTERVAL_SECONDS:-5}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_API_VERSION: ${GITHUB_API_VERSION:-2022-11-28}
      GITHUB_API_TIMEOUT_SECONDS: ${GITHUB_API_TIMEOUT_SECONDS:-10}
      GITHUB_API_MAX_RETRIES: ${GITHUB_API_MAX_RETRIES:-3}
      GITHUB_SYNC_PAGE_SIZE: ${GITHUB_SYNC_PAGE_SIZE:-100}
      GITHUB_MAX_SYNC_PAGES: ${GITHUB_MAX_SYNC_PAGES:-10}
      GITHUB_WEBHOOK_MAX_PAYLOAD_BYTES: ${GITHUB_WEBHOOK_MAX_PAYLOAD_BYTES:-1048576}
      GITHUB_WEBHOOK_RATE_LIMIT_PER_MINUTE: ${GITHUB_WEBHOOK_RATE_LIMIT_PER_MINUTE:-120}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-*}
      SECURITY_HSTS_ENABLED: ${SECURITY_HSTS_ENABLED:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: mailpit
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@teamlider.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-TeamLeader}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:3000/reset-password}
      EMAIL_VERIFICATION_URL: ${EMAIL_VERIFICATION_URL:-http://localhost:3000/verify-email}
      EMAIL_CHANGE_URL: ${EMAIL_CHANGE_URL:-http://localhost:3000/confirm-email-change}
      RECOVERY_EMAIL_URL: ${RECOVERY_EMAIL_URL:-http://localhost:3000/confirm-recovery-email}
      INVITATION_URL: ${INVITATION_URL:-http://localhost:3000/accept-invitation}
      N8N_AGENT_WEBHOOK_URL: http://n8n:5678/webhook/agent
      N8N_INTERNAL_API_KEY: ${N8N_INTERNAL_API_KEY:-change-me}
      UVICORN_ARGS: "--reload"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-Imagenes}
      SUPABASE_S3_ENDPOINT: ${SUPABASE_S3_ENDPOINT:-}
      SUPABASE_S3_REGION: ${SUPABASE_S3_REGION:-us-east-1}
      SUPABASE_S3_ACCESS_KEY_ID: ${SUPABASE_S3_ACCESS_KEY_ID:-}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${SUPABASE_S3_SECRET_ACCESS_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - teamlider-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teamlider-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 320M

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - teamlider-net

  mongodb:
    image: mongo:7.0
    container_name: mongodb_agent
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)'" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - teamlider-net

  traefik:
    image: "traefik"
    container_name: traefik_proxy
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - teamlider-net

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    # n8n is published through ngrok. Traefik labels are intentionally omitted
    # because the ngrok domain does not resolve to this host, so ACME cannot work.
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - N8N_WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    depends_on:
      - mongodb
    networks:
      - teamlider-net

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok_tunnel
    restart: always
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "n8n:5678"
      - "--url=${SUBDOMAIN}.${DOMAIN_NAME}"
    depends_on:
      - n8n
    networks:
      - teamlider-net

volumes:
  postgres_data:
  pgadmin_data:
  n8n_data:
  traefik_data:
  mongo_data:
  redis_data:

networks:
  teamlider-net:
    driver: bridge
